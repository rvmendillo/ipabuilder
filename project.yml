name: ReyForge
options:
  bundleIdPrefix: com.rvmendillo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "3.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: "NO"
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "NO"

packages:
  ReyForgeCore:
    path: Core
  Zsign:
    url: https://github.com/khcrysalis/Zsign-Package
    revision: c4ba9da4283031c07efa03bce42c4b8602d22e73

targets:
  ReyForgeWidget:
    type: app-extension
    platform: iOS
    sources:
      - App/Widget
      - App/Shared/ThemeSupport.swift
    dependencies:
      - package: ReyForgeCore
    info:
      path: App/Widget/Info.plist
      properties:
        CFBundleDisplayName: ReyForge Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reyforge.runtime.widget
        INFOPLIST_KEY_CFBundleDisplayName: Widget
        SKIP_INSTALL: "YES"

  ReyForgeRuntime:
    type: application
    platform: iOS
    sources:
      - App/Runtime
      - App/Shared
    dependencies:
      - package: ReyForgeCore
      - target: ReyForgeWidget
        embed: true
        codeSign: true
    info:
      path: App/Runtime/Info.plist
      properties:
        CFBundleDisplayName: ReyForge App
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSPhotoLibraryUsageDescription: Choose photos to use in this app.
        NSLocationWhenInUseUsageDescription: Show places near you on the map.
        UIBackgroundModes: [audio]
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_NAME: ReyForgeRuntime
        PRODUCT_BUNDLE_IDENTIFIER: com.reyforge.runtime
        ASSETCATALOG_COMPILER_APPICON_NAME: ""

  ReyForge:
    type: application
    platform: iOS
    sources:
      - path: App/Builder
        excludes:
          - "Resources/Models"
          - "Resources/Models/**"
      - App/Shared
      - path: Core/Sources/ReyForgeLlama
        group: AI
      - path: App/Builder/Resources/Models
        type: folder
        buildPhase: resources
    dependencies:
      - package: ReyForgeCore
      - package: Zsign
        product: Zsign
      - framework: Vendor/llama.xcframework
        embed: true
        codeSign: true
      - target: ReyForgeRuntime
        embed: false
        link: false
    postBuildScripts:
      - name: Embed Runtime Template
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          SRC="${BUILT_PRODUCTS_DIR}/ReyForgeRuntime.app"
          DEST_DIR="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          if [ ! -d "$SRC" ]; then echo "warning: ReyForgeRuntime.app not found at $SRC"; exit 0; fi
          mkdir -p "$DEST_DIR"
          rm -f "$DEST_DIR/RuntimeTemplate.zip"
          cd "${BUILT_PRODUCTS_DIR}"
          /usr/bin/ditto -c -k --norsrc --keepParent "ReyForgeRuntime.app" "$DEST_DIR/RuntimeTemplate.zip"
          echo "Embedded runtime template: $(du -h "$DEST_DIR/RuntimeTemplate.zip" | cut -f1)"
    info:
      path: App/Builder/Info.plist
      properties:
        CFBundleDisplayName: ReyForge
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSLocalNetworkUsageDescription: ReyForge runs a short-lived localhost server to hand signed IPAs to the iOS installer, and can talk to AI servers on your network.
        NSPhotoLibraryUsageDescription: Pick photos for your app icons and screens.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.rvmendillo.reyforge
            CFBundleURLSchemes: [reyforge]
    settings:
      base:
        PRODUCT_NAME: ReyForge
        PRODUCT_BUNDLE_IDENTIFIER: com.rvmendillo.reyforge
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"

  ReyForgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - App/Tests/Unit
      - Core/Tests/ReyForgeCoreTests/FixtureData.swift
    dependencies:
      - target: ReyForge
      - package: ReyForgeCore
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ReyForge.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ReyForge"
        BUNDLE_LOADER: "$(TEST_HOST)"
        PRODUCT_BUNDLE_IDENTIFIER: com.rvmendillo.reyforge.tests
        GENERATE_INFOPLIST_FILE: "YES"

  ReyForgeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - App/Tests/UI
    dependencies:
      - target: ReyForge
    settings:
      base:
        TEST_TARGET_NAME: ReyForge
        PRODUCT_BUNDLE_IDENTIFIER: com.rvmendillo.reyforge.uitests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  ReyForge:
    build:
      targets:
        ReyForge: all
        ReyForgeRuntime: all
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - ReyForgeTests
        - ReyForgeUITests
    run:
      config: Debug
    archive:
      config: Release
  ReyForgeRuntime:
    build:
      targets:
        ReyForgeRuntime: all
    run:
      config: Debug
