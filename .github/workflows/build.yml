name: Build ReyForge

# Builds, tests and packages ReyForge on every push.
# - Core (logic, AI agent, templates, IPA assembly) is tested on Linux and macOS.
# - The iOS app is built with Xcode, unit + UI tested on the iOS Simulator, and packaged as IPAs:
#     ReyForge-<version>.ipa       full build with the built-in on-device model (Qwen3.5 2B, Apache-2.0)
#     ReyForge-<version>-lite.ipa  without the bundled model (download models in-app)
# - If signing secrets are configured, a signed IPA is produced with YOUR certificate.
# - Pushes to the default branch publish a rolling "nightly" release that ReyForge's in-app
#   updater installs (re-signed on-device with your certificate). Tags v* publish a full release.
#
# Optional repository secrets (Settings → Secrets and variables → Actions):
#   SIGNING_P12_BASE64      base64 of your .p12 (certificate + private key)
#   SIGNING_P12_PASSWORD    its password
#   SIGNING_PROFILE_BASE64  base64 of your .mobileprovision
#   SIGNING_BUNDLE_ID       (optional) bundle id to sign as

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release with the IPAs"
        type: boolean
        default: false
      run_ui_tests:
        description: "Run UI tests"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  MODEL_FILE: Qwen3.5-2B-Q4_K_M.gguf

jobs:
  core-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test ReyForgeCore
        working-directory: Core
        run: swift test 2>&1 | tail -n 60

  ios:
    name: iOS build, tests & IPA
    runs-on: macos-26
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}
      signed: ${{ steps.sign.outputs.signed }}
      bundle_id: ${{ steps.sign.outputs.bundle_id }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          XCODE="$(ls -d /Applications/Xcode*.app | grep -v -i beta | sort -V | tail -1)"
          [ -n "$XCODE" ] || XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcrun simctl list runtimes | tail -n 8
          sw_vers

      - name: Version
        id: version
        run: |
          BASE="$(grep -m1 'MARKETING_VERSION' project.yml | sed -E 's/.*"([0-9.]+)".*/\1/')"
          echo "version=$BASE" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "ReyForge $BASE ($GITHUB_RUN_NUMBER)"

      - name: Core tests (macOS)
        working-directory: Core
        run: |
          mkdir -p ../build
          if swift test > ../build/core-macos.log 2>&1; then
            grep -E "Executed [0-9]+ tests" ../build/core-macos.log | tail -n 1
          else
            grep -v -E "warning:|^ +[0-9]+ \||^ +\||note:" ../build/core-macos.log | tail -n 250
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen || brew upgrade xcodegen || true

      - name: Restore llama.cpp build
        id: llama-cache
        uses: actions/cache/restore@v4
        with:
          path: Vendor/llama
          key: llama-static-${{ hashFiles('scripts/build-llama.sh') }}-v2

      - name: Build llama.cpp (iOS + Simulator)
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: scripts/build-llama.sh Vendor/llama

      - name: Save llama.cpp build
        if: steps.llama-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Vendor/llama
          key: llama-static-${{ hashFiles('scripts/build-llama.sh') }}-v2

      - name: Restore built-in model
        id: model-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/reyforge-models
          key: model-${{ env.MODEL_FILE }}-v2

      - name: Download built-in model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: scripts/fetch-model.sh ~/reyforge-models

      - name: Save built-in model
        if: steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/reyforge-models
          key: model-${{ env.MODEL_FILE }}-v2

      - name: Generate Xcode project
        run: |
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"${{ steps.version.outputs.build }}\"/" project.yml
          xcodegen generate

      - name: Restore Swift packages
        id: spm-cache
        uses: actions/cache/restore@v4
        with:
          path: build/SourcePackages
          key: spm-${{ hashFiles('project.yml') }}-v1

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project ReyForge.xcodeproj -scheme ReyForge -clonedSourcePackagesDirPath build/SourcePackages

      - name: Save Swift packages
        if: steps.spm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/SourcePackages
          key: spm-${{ hashFiles('project.yml') }}-v1

      - name: Pick simulator
        id: sim
        run: |
          UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          best=None
          for rt,devs in d.items():
              if "iOS" not in rt: continue
              for x in devs:
                  if x["name"].startswith("iPhone") and "Pro" in x["name"] and "Max" not in x["name"]:
                      key=(rt, x["name"])
                      if best is None or key>best[0]: best=(key,x["udid"])
          print(best[1] if best else "")')"
          [ -n "$UDID" ] || UDID="$(xcrun simctl list devices available | grep -m1 -E 'iPhone' | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$UDID"

      - name: Build for testing (Simulator)
        id: buildsim
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project ReyForge.xcodeproj -scheme ReyForge -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath build/SourcePackages \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build/build-sim.log | grep -E "error:|warning: .*ReyForge|BUILD|\*\*" || true
          grep -q "TEST BUILD SUCCEEDED\|BUILD SUCCEEDED" build/build-sim.log || { echo "== Compile errors =="; grep -E ":[0-9]+:[0-9]+: error:" build/build-sim.log | sort -u | head -n 250; echo "== Other errors =="; grep -E "error:" build/build-sim.log | grep -v -E ":[0-9]+:[0-9]+: error:" | sort -u | head -n 60; exit 1; }

      - name: Unit tests (Simulator)
        if: ${{ !cancelled() && steps.buildsim.outcome == 'success' }}
        run: |
          set -o pipefail
          # The simulator can read the host file system: the LLM test loads the cached model directly.
          export TEST_RUNNER_REYFORGE_MODEL_PATH="$HOME/reyforge-models/$MODEL_FILE"
          xcodebuild test-without-building \
            -project ReyForge.xcodeproj -scheme ReyForge \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath build/SourcePackages \
            -only-testing:ReyForgeTests -resultBundlePath build/UnitTests.xcresult \
            2>&1 | tee build/unit-tests.log | grep -E "Test Case|error:|passed|failed|\*\*" | tail -n 150

      - name: UI tests (Simulator)
        if: ${{ !cancelled() && steps.buildsim.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.run_ui_tests) }}
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project ReyForge.xcodeproj -scheme ReyForge \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath build/SourcePackages \
            -only-testing:ReyForgeUITests -resultBundlePath build/UITests.xcresult \
            2>&1 | tee build/ui-tests.log | grep -E "Test Case|error:|passed|failed|\*\*" | tail -n 150

      - name: Export test screenshots
        if: always()
        run: |
          mkdir -p build/screenshots
          for r in build/UITests.xcresult build/UnitTests.xcresult; do
            [ -d "$r" ] || continue
            xcrun xcresulttool export attachments --path "$r" --output-path build/screenshots/$(basename "$r" .xcresult) 2>/dev/null || true
          done
          find build/screenshots -type f | head -n 80

      - name: Build for device (unsigned Release)
        id: devicebuild
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          cp ~/reyforge-models/${{ env.MODEL_FILE }} App/Builder/Resources/Models/
          xcodebuild build \
            -project ReyForge.xcodeproj -scheme ReyForge -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedDataDevice -clonedSourcePackagesDirPath build/SourcePackages \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build/build-device.log | grep -E "error:|BUILD|\*\*" || true
          grep -q "BUILD SUCCEEDED" build/build-device.log || { echo "== Compile errors =="; grep -E ":[0-9]+:[0-9]+: error:" build/build-device.log | sort -u | head -n 250; grep -E "error:" build/build-device.log | grep -v -E ":[0-9]+:[0-9]+: error:" | sort -u | head -n 60; exit 1; }
          APP="build/DerivedDataDevice/Build/Products/Release-iphoneos/ReyForge.app"
          ls -la "$APP" "$APP/Frameworks" || true
          unzip -l "$APP/RuntimeTemplate.zip" | tail -n 3

      - name: Package IPAs
        if: ${{ !cancelled() && steps.devicebuild.outcome == 'success' }}
        run: |
          V="${{ steps.version.outputs.version }}"
          APP="build/DerivedDataDevice/Build/Products/Release-iphoneos/ReyForge.app"
          scripts/package-ipa.sh "$APP" "dist/ReyForge-$V-unsigned.ipa"
          scripts/package-ipa.sh "$APP" "dist/ReyForge-$V-lite-unsigned.ipa" --lite
          ls -la dist

      - name: Sign with your certificate
        id: sign
        if: ${{ !cancelled() && steps.devicebuild.outcome == 'success' }}
        env:
          P12: ${{ secrets.SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
          PROFILE: ${{ secrets.SIGNING_PROFILE_BASE64 }}
          BUNDLE_ID: ${{ secrets.SIGNING_BUNDLE_ID }}
        run: |
          if [ -z "$P12" ] || [ -z "$PROFILE" ]; then
            echo "No signing secrets configured — skipping (install via ReyForge's in-app updater or sign on-device)."
            echo "signed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          V="${{ steps.version.outputs.version }}"
          mkdir -p "$RUNNER_TEMP/sign"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/sign/cert.p12"
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/sign/profile.mobileprovision"
          scripts/sign-ipa.sh "dist/ReyForge-$V-lite-unsigned.ipa" "dist/ReyForge-$V-lite-signed.ipa" "$RUNNER_TEMP/sign/cert.p12" "$P12_PASSWORD" "$RUNNER_TEMP/sign/profile.mobileprovision" "$BUNDLE_ID"
          scripts/sign-ipa.sh "dist/ReyForge-$V-unsigned.ipa" "dist/ReyForge-$V-signed.ipa" "$RUNNER_TEMP/sign/cert.p12" "$P12_PASSWORD" "$RUNNER_TEMP/sign/profile.mobileprovision" "$BUNDLE_ID"
          rm -rf "$RUNNER_TEMP/sign"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Upload IPAs
        if: ${{ !cancelled() && steps.devicebuild.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ReyForge-IPAs
          path: dist/*.ipa
          retention-days: 14
          compression-level: 0

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ReyForge-test-results
          path: |
            build/*.log
            build/screenshots
            build/DerivedData/Logs/Test/*.xcresult
          retention-days: 14

      - name: Publish release
        id: release
        if: ${{ success() && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) || (github.event_name == 'workflow_dispatch' && inputs.release)) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.version.outputs.version }}"
          B="${{ steps.version.outputs.build }}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"; TITLE="ReyForge $V"; PRE=""
          else
            TAG="nightly"; TITLE="ReyForge $V nightly ($B)"; PRE="--prerelease"
            gh release delete nightly --yes --cleanup-tag || true
          fi
          NOTES="ReyForge $V build $B — $(git log -1 --pretty=%s)

          Install: open ReyForge → Settings → Updates (re-signs with your certificate on-device), or sideload the signed IPA.
          *-unsigned.ipa can be signed with any signer (ReyForge, ESign, Feather, Sideloadly). Lite builds download the AI model in-app."
          gh release create "$TAG" dist/*.ipa --title "$TITLE" --notes "$NOTES" --target "$GITHUB_SHA" $PRE
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  install-page:
    name: Install page (GitHub Pages)
    needs: ios
    # Needs Settings › Pages › Source: GitHub Actions. Skipped unless a signed IPA was released.
    if: ${{ needs.ios.outputs.tag != '' && needs.ios.outputs.signed == 'true' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build install page
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
          TAG: ${{ needs.ios.outputs.tag }}
          VERSION: ${{ needs.ios.outputs.version }}
          BUNDLE_ID: ${{ needs.ios.outputs.bundle_id }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p site
          cp App/Builder/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png site/icon.png
          python3 - <<'PY'
          import os, plistlib, html, urllib.parse
          base = os.environ["BASE_URL"].rstrip("/")
          repo, tag, version = os.environ["REPO"], os.environ["TAG"], os.environ["VERSION"]
          bundle = os.environ.get("BUNDLE_ID") or "com.rvmendillo.reyforge"
          def ipa(name): return f"https://github.com/{repo}/releases/download/{tag}/{name}"
          for kind, name in [("full", f"ReyForge-{version}-signed.ipa"), ("lite", f"ReyForge-{version}-lite-signed.ipa")]:
              manifest = {"items": [{"assets": [{"kind": "software-package", "url": ipa(name)},
                                                {"kind": "display-image", "url": f"{base}/icon.png"},
                                                {"kind": "full-size-image", "url": f"{base}/icon.png"}],
                                     "metadata": {"bundle-identifier": bundle, "bundle-version": version, "kind": "software", "title": "ReyForge"}}]}
              with open(f"site/manifest-{kind}.plist", "wb") as f: plistlib.dump(manifest, f)
          def itms(kind): return "itms-services://?action=download-manifest&url=" + urllib.parse.quote(f"{base}/manifest-{kind}.plist", safe="")
          page = f"""<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Install ReyForge</title><style>
          body{{margin:0;background:#0E0B1F;color:#fff;font:17px -apple-system,system-ui;text-align:center;padding:40px 24px}}
          img{{width:120px;border-radius:27px;box-shadow:0 12px 30px #6C5CFF66}} h1{{margin:18px 0 6px}} p{{color:#B9B4D9}}
          a.b{{display:block;max-width:320px;margin:14px auto;padding:15px;border-radius:14px;color:#fff;text-decoration:none;font-weight:600;background:linear-gradient(135deg,#6C5CFF,#FF7A45)}}
          a.s{{background:#2A2540}}</style></head><body>
          <img src="icon.png" alt=""><h1>ReyForge {html.escape(version)}</h1><p>Signed with your certificate · {html.escape(tag)}</p>
          <a class="b" href="{itms('full')}">Install (with built-in AI model)</a>
          <a class="b s" href="{itms('lite')}">Install lite (download models in-app)</a>
          <p style="font-size:14px">Open this page in Safari on your iPhone. Your device must be in the profile.</p></body></html>"""
          open("site/index.html", "w").write(page)
          PY
          ls -la site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
